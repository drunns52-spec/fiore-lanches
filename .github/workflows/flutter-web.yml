
name: Fiori Lanches Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar estrutura Web
        run: flutter create --platforms=web .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Conferir arquivo antes da compilação
        run: |
          echo "Commit utilizado:"
          git rev-parse --short HEAD
          echo "Primeiras linhas do main.dart:"
          head -n 15 lib/main.dart
          echo "Referências ao tema:"
          grep -n "colorScheme:" lib/main.dart || true

      - name: Compilar Flutter Web
        run: flutter build web --release --base-href /fiori-lanches/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar aplicativo
        id: deployment
        uses: actions/deploy-pages@v4
